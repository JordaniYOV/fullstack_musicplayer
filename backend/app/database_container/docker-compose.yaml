

version: '3.8'

services:
  postgres: 
    images: postgres:15-alpine
    container_name: muse_container_pg
    environment:
      - .env
    ports: 
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - muse_network

volumes:
  postgres_data
networks:
  muse_network: 
    driver: bridge
