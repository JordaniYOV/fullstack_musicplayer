
services:
  # PostgreSQL  
  postgres:
    image: postgres:17-alpine
    container_name: muse_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-muse}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
    ports:
      - "${POSTGRES_PORT:-5431}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-muse}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - muse_network
 
  # Redis 
  redis:
    image: redis:7-alpine
    container_name: muse_redis
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - muse_network
 
  # Kafka (KRaft) 
  kafka:
    image: apache/kafka:latest
    container_name: muse_kafka
    environment:
      # KRaft settings
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
 
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092,EXTERNAL://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
 
      # Topic defaults
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_LOG_RETENTION_HOURS: "168"     

      # Tell Kafka to create the internal offsets topic on startup
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"   # speeds up first join
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"      
 
      # Performance
      KAFKA_MESSAGE_MAX_BYTES: "1048576"      
      KAFKA_REPLICA_FETCH_MAX_BYTES: "1048576"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"       
      - "9094:9094"       
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test:
        - "CMD-SHELL"
        - "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    restart: unless-stopped
    networks:
      - muse_network
 
  #  Kafka UI (dev only — comment out in prod) 
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: muse_kafka_ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: muse-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - muse_network
    profiles:
      - dev          
  # Celery worker 
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: muse_celery_worker
    command: >
      celery -A app.celery_app worker
      --loglevel=info
      --queues=default,aggregation
      --concurrency=4
    environment:
      - ASYNC_DB_URL=postgresql+psycopg://postgres:1234@postgres:5432/muse
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - muse_network
 
  #  Celery beat (scheduler)
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: muse_celery_beat
    command: celery -A app.celery_app beat --loglevel=info
    environment:
      - ASYNC_DB_URL=postgresql+psycopg://postgres:1234@postgres:5432/muse
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - muse_network
 
volumes:
  postgres_data:
  kafka_data:
 
networks:
  muse_network:
    driver: bridge